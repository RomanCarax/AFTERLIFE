[package]
name = "afterlife"
version = "0.1.4"
description = "AFTERLIFE - yt-dlp + libmpv music player"
edition = "2021"

[lib]
name = "afterlife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# yt-dlp 포터블 exe를 GitHub 릴리스에서 받아오기 (Windows 기본 TLS 사용)
reqwest = { version = "0.12", features = ["json", "blocking"] }
# mpv 대신 YouTube 오디오를 받아 흘려 주는 이 PC 전용 중계 서버 (127.0.0.1)
tiny_http = "0.12"
sha2 = "0.10"
# libmpv 포터블: GitHub에서 받은 .7z 를 풀고(sevenz-rust2), DLL을 실행 중에 불러 씀(libloading)
sevenz-rust2 = "0.20"
libloading = "0.8"
# yt-dlp 는 실행이 빠른 "미리 풀어 둔" 판(yt-dlp_win.zip)을 받아 풂
zip = { version = "2", default-features = false, features = ["deflate"] }
# 오디오 주소 캐시: 같은 곡을 동시에 여러 번 뽑지 않게 (tauri 가 이미 쓰는 tokio)
tokio = { version = "1", features = ["sync"] }
